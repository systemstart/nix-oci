version: 2

# nix-oci is a Nix-ecosystem tool, so it targets the platforms Nix itself runs
# on. Windows is deliberately omitted: Nix does not run there natively, so a
# /nix/store writer has no audience on it.
project_name: nix-oci

builds:
  - main: ./cmd/nix-oci
    binary: nix-oci
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      # Matches the writer's design: pure Go, statically linked, no cgo.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Release notes are generated by git-cliff (cliff.toml) and passed in with
# --release-notes by `make release`. goreleaser's own model of a commit is
# (sha, subject, author) -- it never parses conventional-commit footers, so a
# BREAKING CHANGE description could not reach the release page. cliff.toml owns
# the header and footer too, because --release-notes replaces the whole body.
#
# Do NOT add `changelog: disable: true` here to express that. It does more than
# switch off goreleaser's generator: "this will also ignore any changelog files
# passed via --release-notes, and will render an empty changelog", which
# published v0.5.0 with a completely empty release body. Passing
# --release-notes is by itself enough -- the flag "will skip GoReleaser
# changelog generation" -- so the generator settings below are moot whenever
# `make release` is used, and only apply to a bare `goreleaser release`.
changelog:
  sort: asc
  # Short SHAs; the default prints all 40 characters, which drowns the subject.
  abbrev: 7

release:
  github:
    owner: systemstart
    name: nix-oci
  # "auto" marks a release as a pre-release only when the tag carries a semver
  # pre-release identifier (v0.4.0-rc1). A plain v0.4.0 is a full release.
  prerelease: auto
